[workspace]
members = [
  "crates/synapse-app",
  "crates/synapse-core",
  "crates/synapse-store",
  "crates/synapse-llm",
  "crates/synapse-acp",
  "crates/synapse-mcp",
  "crates/synapse-tools",
  "crates/synapse-research",
  "crates/synapse-personas",
  "crates/synapse-acceptance",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

# Pinned shared dependencies (see docs/STACK.md).
# Pre-1.0 crates that churn are pinned exactly (=x.y.z).
# Entries here are resolved only once a crate uses `{ workspace = true }`,
# so adding a pin costs nothing until it is actually adopted.
[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
rusqlite_migration = { version = "=2.3.0" }
genai = { version = "=0.2.4" }
rmcp = { version = "=0.8.0", features = ["client", "server", "transport-child-process", "transport-streamable-http-client-reqwest", "auth"] }
agent-client-protocol = { version = "=0.3.0" }
globset = "0.4"
schemars = "1"
toml = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
secrecy = "0.10"
keyring = "3"
regex = "1"
aho-corasick = "1"
similar = "2"
notify = "8"
croner = "3"
dirs = "6"
interprocess = "2"
nono = { version = "=0.8.0" }
dom_smoothie = { version = "=0.18.0" }
htmd = { version = "=0.5.0" }
gray_matter = { version = "=0.3.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = false
